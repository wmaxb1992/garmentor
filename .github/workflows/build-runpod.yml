name: Build RunPod images

on:
  push:
    branches: [main]
    paths:
      - "runpod/garment-gpt/**"
      - "runpod/flux-edit/**"
      - "runpod/triposr/**"
      - "runpod/cloth-sim/**"
      - ".github/workflows/build-runpod.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # NOTE: pattern, flux-edit, and triposr images now bake in model weights
  # and are 10-25 GB each — too large for GitHub Actions free runners.
  # Build those LOCALLY (see Dockerfile header comments). Only cloth-sim
  # (no model weights, ~2 GB) is small enough for CI.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cloth-sim
            context: runpod/cloth-sim
            image: garmentor-cloth-sim
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
