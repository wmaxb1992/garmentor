name: Build & Push RunPod Worker Images

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Comma-separated worker names (or 'all')"
        default: "all"
        required: false
  push:
    paths:
      - "runpod/**"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          INPUT="${{ github.event.inputs.workers || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            echo 'matrix=["triposr","flux-edit","cloth-sim","garment-gpt"]' >> "$GITHUB_OUTPUT"
          else
            # Convert comma-separated to JSON array
            ARRAY=$(echo "$INPUT" | python3 -c "import sys,json; print(json.dumps([x.strip() for x in sys.stdin.read().split(',')]))")
            echo "matrix=$ARRAY" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
        include:
          - worker: triposr
            context: runpod/triposr
            image_name: garmentor-3d
          - worker: flux-edit
            context: runpod/flux-edit
            image_name: garmentor-flux-edit
          - worker: cloth-sim
            context: runpod/cloth-sim
            image_name: garmentor-cloth-sim
          - worker: garment-gpt
            context: runpod/garment-gpt
            image_name: garmentor-pattern
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
